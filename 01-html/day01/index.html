<!doctype html>
<html lang="ja">
  <!-- メタ情報 -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>テストページ</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <!-- 表示コンテンツ -->
  <body>
    <!-- ヘッダー -->
    <div class="header">
      <div class="header-top">
        <!-- ロゴ -->
        <h1 class="logo" aria-label="POKIZON">
          <span class="logo__mark" aria-hidden="true">P</span>
          <span class="logo__name">POKIZON</span>
        </h1>

        <div class="header-actions">
          <!-- ログイン -->
          <!-- <a href="#" class="btn-login">ログイン</a> -->
          <button
            onclick="alertPush(this.value)"
            class="btn-login"
            value="login"
          >
            ログイン
          </button>
          <!-- カート -->
          <!-- <a href="#" class="btn-cart">カート</a> -->
          <button onclick="alertPush(this.value)" class="btn-cart" value="cart">
            カート
          </button>
          <button type="button" id="showDialog" class="btn-add">追加</button>
        </div>
      </div>

      <form class="search" action="#" method="get">
        <label class="visually-hidden" for="site-search">商品を検索</label>
        <input
          id="site-search"
          type="search"
          name="q"
          placeholder="商品を検索"
        />
        <button type="submit">検索</button>
      </form>
    </div>

    <!-- ナビゲーション -->
    <div class="nav">
      <!-- 商品カテゴリー -->
      <nav>
        <ul class="nav-list">
          <li><a href="#">ホーム</a></li>
          <li><a href="#">食品</a></li>
          <li><a href="#">インテリア</a></li>
          <li><a href="#">衣類</a></li>
        </ul>
      </nav>
    </div>

    <!-- バナーやおすすめ商品の案内 -->
    <!-- <div class="banner"></div> -->

    <!-- 商品一覧 -->
    <section class="product" id="productList">
      <article class="product-card">
        <img src="images/product.webp" alt="商品の画像" />
        <h2>プレゼント</h2>
        <p class="product-price">¥100</p>
        <a class="product-button" href="#">商品を見る</a>
      </article>
      <article class="product-card">
        <img src="images/product.webp" alt="商品の画像" />
        <h2>プレゼント</h2>
        <p class="product-price">¥100</p>
        <a class="product-button" href="#">商品を見る</a>
      </article>
      <article class="product-card">
        <img src="images/product.webp" alt="商品の画像" />
        <h2>プレゼント</h2>
        <p class="product-price">¥100</p>
        <a class="product-button" href="#">商品を見る</a>
      </article>
      <article class="product-card">
        <img src="images/product.webp" alt="商品の画像" />
        <h2>プレゼント</h2>
        <p class="product-price">¥100</p>
        <a class="product-button" href="#">商品を見る</a>
      </article>
      <article class="product-card">
        <img src="images/product.webp" alt="商品の画像" />
        <h2>プレゼント</h2>
        <p class="product-price">¥100</p>
        <a class="product-button" href="#">商品を見る</a>
      </article>
    </section>

    <!-- フッター -->
    <div class="footer">
      <!-- 問い合わせ・配送・返品案内 -->
    </div>
  </body>
</html>

    <dialog id="addDialog" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">商品の詳細入力</h2>
      <form id="productDetail">
        <label for="product-name">商品名</label>
        <input
          id="product-name"
          name="productName"
          type="text"
          placeholder="商品名"
          required
        />
        <label for="product-name">商品価格</label>
        <input
          id="product-price"
          name="productPrice"
          type="number"
          min="0"
          placeholder="商品価格"
          required
        />
        <label for="productProperty">カテゴリー</label>
        <select id="productProperty" name="productProperty">
          <option value="home"></option>
          <option value="food">食品</option>
          <option value="furniture">インテリア</option>
          <option value="wear">衣類</option>
        </select>
        <button type="submit">追加</button>
        <button type="button" id="closeDialog">閉じる</button>
      </form>
    </dialog>
  </body>
</html>
